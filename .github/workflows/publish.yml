name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'          # stable builds (e.g., 1.2.3)
      - '[0-9]+.[0-9]+.[0-9]+-*'        # prerelease builds (e.g., 1.2.3-rc.1)

jobs:
  pack_and_publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write                   # create the GitHub Release for the tag
      id-token: write                   # keep if using NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4       # tag-triggered runs check out the tagged commit
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - name: Resolve version from tag
        shell: bash
        run: |
          set -e

          PKG_VERSION="${GITHUB_REF_NAME}"

          # The trigger patterns are filters, not validators; enforce the full
          # SemVer shape here (no v prefix, no build metadata).
          if [[ ! "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${PKG_VERSION}' is not a publishable version. Expected MAJOR.MINOR.PATCH with an optional -prerelease suffix, e.g. 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          echo "Publishing ${PKG_VERSION} (tag ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}, actor ${GITHUB_ACTOR})"
          echo "PKG_VERSION=$PKG_VERSION" | tee -a "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: |
          dotnet pack src/Liaison.Mediator/Liaison.Mediator.csproj \
            -c Release \
            -o artifacts \
            -p:PackageVersion=${{ env.PKG_VERSION }} \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg

      - name: NuGet Login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: asp2286

      - name: Publish to nuget.org (Trusted Publishing)
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          # gh prepends --notes-file content to the --generate-notes changelog,
          # so the release body is the NuGet link followed by generated notes.
          printf '📦 NuGet: https://www.nuget.org/packages/Liaison.Mediator/%s\n\n' "$PKG_VERSION" > release-notes.md

          FLAGS=(--title "Liaison.Mediator $PKG_VERSION" --verify-tag --generate-notes --notes-file release-notes.md)
          if [[ "$PKG_VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$PKG_VERSION" \
            "artifacts/Liaison.Mediator.$PKG_VERSION.nupkg" \
            "artifacts/Liaison.Mediator.$PKG_VERSION.snupkg" \
            "${FLAGS[@]}"
