name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Liaison.Mediator.sln

      - name: Build
        run: dotnet build Liaison.Mediator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Liaison.Mediator.sln --configuration Release --no-build

  aot-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT smoke test
        run: dotnet publish tests/AotSmokeTest/AotSmokeTest.csproj --configuration Release --runtime linux-x64

      - name: Run NativeAOT smoke test
        run: ./tests/AotSmokeTest/bin/Release/net10.0/linux-x64/publish/AotSmokeTest
